[package]
name = "signet-core"
description = "Command/event facade over the Signet core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
signet-store.workspace = true
signet-sync.workspace = true
signet-mime.workspace = true
signet-auth.workspace = true
base64.workspace = true
mail-builder.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zip = { version = "5", default-features = false, features = ["deflate"] }
outlook-pst = "1.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Fetches remote images for "Show images"; see remote.rs for why the webview cannot.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

[dev-dependencies]
signet-net.workspace = true
signet-mime.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
zip = { version = "5", default-features = false, features = ["deflate"] }

[lints]
workspace = true
